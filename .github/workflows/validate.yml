name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep CLI
        run: az bicep install
      - name: Validate repository
        shell: pwsh
        run: ./scripts/Test-Repository.ps1

  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/Test-Repository.ps1 -SkipBicep
      - name: Validate with PowerShell 7
        shell: pwsh
        run: ./scripts/Test-Repository.ps1 -SkipBicep